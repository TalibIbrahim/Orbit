# Immich stack for arm-free. Two modes (ORBIT_PRIMARY_MODE in ../.env):
#
#  device   (default): STANDBY. NOT started by default; `docker compose up` happens only
#           through scripts/promote-standby.sh after it restores the newest PC dump into
#           DB_DATA_LOCATION=/srv/orbit/immich-standby-db. Machine learning stays off.
#  arm-free: PERMANENT PRIMARY. Started by scripts/install-arm-free.sh with a fresh
#           database (DB_DATA_LOCATION=/srv/orbit/immich-db), no restore. Machine
#           learning runs in a CPU/memory-limited container enabled by COMPOSE_PROFILES=ml
#           (installer; --no-ml disables it).
#
# Based on Immich's official docker-compose.yml
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# immich-config.json (generated by the installer, see immich-config.example.json) is
# mounted read-only and loaded via IMMICH_CONFIG_FILE: it enables/disables machine
# learning and limits job concurrency to 1. NOTE: a config file makes those settings
# READ-ONLY in the Immich admin UI. Comment out IMMICH_CONFIG_FILE in .env to manage them there.
#
# IMPORTANT (device mode): the database image must match what runs on the PC. Copy the
# exact postgres image reference (tag@sha256 digest) from the docker-compose.yml of the
# Immich release you run on the PC into IMMICH_POSTGRES_IMAGE in .env, otherwise the
# restore can fail (vector extension version mismatch).

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      # Device mode: the Syncthing replica of the PC library (Receive Only; promote leaves it paused).
      # arm-free mode: the live library (Send Only to the replicas).
      - ${UPLOAD_LOCATION:-/srv/orbit/immich-library}:/data
      - ./immich-config.json:/config/immich.json:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:2283:2283"
    depends_on:
      - redis
      - database
    restart: unless-stopped
    # Hard CPU cap plus a relative weight under contention.
    cpus: ${IMMICH_SERVER_CPUS:-1.5}
    cpu_shares: 512

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    # Only started with COMPOSE_PROFILES=ml (arm-free mode, unless --no-ml).
    profiles: ["ml"]
    volumes:
      - /srv/orbit/immich-ml-cache:/cache
    environment:
      MACHINE_LEARNING_WORKERS: "1"
      MACHINE_LEARNING_REQUEST_THREADS: "1"
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: "1"
      MACHINE_LEARNING_MODEL_INTER_OP_THREADS: "1"
      MACHINE_LEARNING_MODEL_TTL: "300"
    cpus: ${IMMICH_ML_CPUS:-1.0}
    mem_limit: ${IMMICH_ML_MEM:-3g}
    cpu_shares: 256
    restart: unless-stopped

  redis:
    container_name: immich_redis
    # Match the valkey tag in the official compose of your Immich release.
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ${IMMICH_POSTGRES_IMAGE:?set IMMICH_POSTGRES_IMAGE in .env}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION:-/srv/orbit/immich-standby-db}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
