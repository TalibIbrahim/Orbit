# Orbit main stack for the Oracle Always Free Arm VM ("arm-free", linux/arm64).
#   cd /opt/orbit/deploy/arm-free && cp .env.example .env && docker compose up -d
#
# Everything is bound to the Tailscale IP (TAILSCALE_IP) - nothing is public.
# Persistent data lives under /srv/orbit (same paths the agent config uses).
# Auto-updates: systemd timer orbit-update.timer -> scripts/update.sh (no Watchtower).

name: orbit

services:
  orbit-web:
    # Build from the repo by default (context = repo root, npm workspaces).
    # To use a prebuilt image instead, comment out `build:` and set
    #   image: ghcr.io/OWNER/orbit-web:latest
    build:
      context: ../..
      dockerfile: deploy/web.Dockerfile
    image: orbit-web:local
    container_name: orbit-web
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3000:3000"
    environment:
      ORBIT_DATA_DIR: /data
      ORBIT_HUB_URL: "${ORBIT_HUB_URL:-}"
      ORBIT_PASSWORD: "${ORBIT_PASSWORD:-}"   # optional dashboard password
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      # The hub registers arm-free's own agent from its config (token, role) on startup.
      ORBIT_LOCAL_AGENT_CONFIG: /run/orbit/agent.json
      ORBIT_LOCAL_AGENT_URL: "http://${TAILSCALE_IP:-127.0.0.1}:7420"
    volumes:
      # Hub database/settings. Must be writable by uid 1000 (install script chowns it).
      - /srv/orbit/orbit-data:/data
      - /etc/orbit/agent.json:/run/orbit/agent.json:ro
    # CPU weight (relative, only matters under contention): the hub is light, so it gets a low share.
    cpu_shares: 256
    mem_limit: 512m
    labels:
      - "orbit.update-notify=true"

  syncthing:
    image: syncthing/syncthing:2
    container_name: syncthing
    hostname: arm-free
    restart: unless-stopped
    # Host networking: LAN/Tailscale discovery and direct connections work
    # without port mapping (22000/tcp+udp, 21027/udp).
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
      STGUIADDRESS: "127.0.0.1:8384"   # GUI/REST only on loopback; the agent runs on the host
    volumes:
      - /srv/orbit/syncthing-config:/var/syncthing/config
      # Replica root mounted at the same path inside and outside the container so
      # folder paths in Syncthing equal host paths (needed for du / promote).
      - /srv/orbit:/srv/orbit
    # Default weight is 1024. Syncthing gets a middle share so syncs do not starve other services.
    # Change live without restart:  docker update --cpu-shares 1024 syncthing
    cpu_shares: 512
    labels:
      - "orbit.update-notify=true"
