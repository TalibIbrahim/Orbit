# Immich STANDBY stack for arm-free. NOT started by default: `docker compose up`
# only happens through scripts/promote-standby.sh (restores the newest PC dump first).
#
# Based on Immich's official docker-compose.yml
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# but with NO machine-learning container to keep the Arm VM light. Smart search /
# face recognition are therefore unavailable while on standby. IMMICH_MACHINE_LEARNING_ENABLED=false
# is set below; ALSO disable ML in Immich: Administration -> Settings -> Machine
# Learning (the restored DB carries the PC's settings, which may have ML enabled).
#
# IMPORTANT: the database image must match what runs on the PC. Copy the exact
# postgres image reference (tag@sha256 digest) from the docker-compose.yml of the
# Immich release you run on the PC into IMMICH_POSTGRES_IMAGE in .env, otherwise
# the restore can fail (vector extension version mismatch).

name: immich-standby

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      # The Syncthing replica of the PC library (Receive Only; promote leaves it paused).
      - ${UPLOAD_LOCATION:-/srv/orbit/immich-library}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:2283:2283"
    depends_on:
      - redis
      - database
    restart: unless-stopped
    cpu_shares: 512

  redis:
    container_name: immich_redis
    # Match the valkey tag in the official compose of your Immich release.
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ${IMMICH_POSTGRES_IMAGE:?set IMMICH_POSTGRES_IMAGE in .env (copy from the PC's Immich compose)}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION:-/srv/orbit/immich-standby-db}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
